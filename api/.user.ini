; Límites de subida para la API (videos). Ferozo los toma de este archivo (PHP-FPM); si no, cambialos en el panel: PHP > Configuración.
upload_max_filesize = 100M
post_max_size = 105M
max_execution_time = 300
max_input_time = 300
; Para achicar fotos grandes (una de 12 MP del celular usa unos 150 MB)
memory_limit = 512M
